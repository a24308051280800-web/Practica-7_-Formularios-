<!DOCTYPE html> <!-- Tipo de html -->
<html> <!-- Raiz del documento -->
<head> <!-- Guarda los datos no visibles -->
  <meta charset="UTF-8"> <!-- Define caracteres -->
  <title> Formularios en HTML Practica 7 (Formulario con text area) </title> <!-- Titulo de la pestaña -->
</head>

<body>
<h2> Formulario con text area </h2>

<form action="" method="post"> <!-- Crea el formulario -->
Ingresa tu nombre: <br>
<input type="text" name="nombre"> <!-- campo de texto -->
<br>
Ingresa tu correo: <br>
<input type="email" name="correo">
<br>
Ingresa tus comentarios: <br>
<textarea name="comentarios" rows="1" cols="10"></textarea> <!-- Crea texto multilinea -->
<br>
<input type="submit" value="enviar">
<input type="reset" value="borrar">
</form> <!-- boton enviar y borrar -->

</body>
</html>
