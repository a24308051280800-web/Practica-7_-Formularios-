<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title> Formularios en HTML Practica 7 (Formulario con text area) </title>
</head>

<body>
<h2> Formulario con text area </h2>

<form action="" method="post">
Ingresa tu nombre: <br>
<input type="text" name="nombre">
<br>
Ingresa tu correo: <br>
<input type="email" name="correo">
<br>
Ingresa tus comentarios: <br>
<textarea name="comentarios" rows="1" cols="10"></textarea>
<br>
<input type="submit" value="enviar">
<input type="reset" value="borrar">
</form>

</body>
</html>
