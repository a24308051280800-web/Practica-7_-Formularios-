<!DOCTYPE html> <!-- define el tipo de html -->
<html> <!-- contenedor del documento -->
<head> <!-- Guarda los datos no visibles de la pagina -->
  <meta charset="UTF-8"> <!-- optimiza la pagina para celulares -->
  <title> Formularios en HTML Practica 7 (Formularios con botones) </title> <!-- titulo de la pestaña -->
</head>

<body>
<h2> Formulario con botones </h2>
<form action="" method="post"> <!-- abre formulario y envia datos -->
Ingresa tu nombre:
<input type="text" name="nombre"> <!-- crea campo de texto -->
<br>
<button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i> </button> <!-- crea un boton con el texto enviar -->
<button type="reset">Borrar <i class="fa fa-trash"></i></button> <!-- boton para borrare campos -->
</form>

</body>
</html>
