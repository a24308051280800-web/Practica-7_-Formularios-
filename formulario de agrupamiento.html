<!DOCTYPE html> <!-- dfine el tipo de html -->
<html> <!-- raiz del html -->
<head> <!-- guarda los datos no visibles -->
  <meta charset="UTF-8"> <!-- define caracteres -->
  <title> Formularios en HTML Practica 7 (Formularios con agrupamiento) </title> <!-- titulo de la pestaña -->
</head>

<body>
<h2> Formulario con agrupamiento </h2>

<form action="" method="post"> <!-- abre formularios y envia -->
<fieldset>
<legend>Datos personales</legend> <!-- campos especiales en formulario -->
Nombre y apellido:
<input type="text" name="nombre_apellido"><br>
Documento valido:
<input type="file" name="documento"><br> <!-- campo para adjuntar archivos -->
Fecha de nacimiento:

<input type="date" name="fecha_nacimiento">
</fieldset>
<fieldset> <!-- organiza los datos de formulario -->
<legend>Datos de estudio:</legend>
Nombre de la escuela:
<input type="text" name="escuela"><br>
Certificado valido:
<input type="file" name="certificado"><br>
Fecha de egreso:
<input type="date" name="fecha_egreso">
</fieldset>
<br>
<button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i> </button> <!-- crea boton de aceptar -->
<button type="reset">Borrar <i class="fa fa-trash"></i></button> <!-- crea boton de borrado -->
</form>

</body>
</html>
