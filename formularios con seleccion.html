<!DOCTYPE html> <!-- tipo de html -->
<html> <!-- raiz del documento -->
<head> <!-- guarda datos no visibles -->
  <meta charset="UTF-8"> <!-- declara caracteres -->
  <title> Formularios en HTML Practica 7 (Formularios con seleccion) </title> <!-- titulo pestaña -->
</head>

<body>
<h2> Formulario con seleccion </h2>

<form action="" method="post"> <!-- crea formulario -->
Ingresa tu nombre:
<input type="text" name="nombre"> <!-- crea campo de texto -->

<br>
Selecciona tu pais:
<select name="pais">
<option value="1">Argentina</option>
<option value="2">España</option>
<option value="3">Mexico</option>
<option value="4">Guatemala</option>
<option value="5">Honduras</option>
<option value="6">El Salvador</option>
<option value="7">Venezuela</option>
<option value="8">Colombia</option>
</select> <!-- hace seleccionable las opciones -->
<br>
<input type="submit" value="enviar">
<input type="reset" value="borrar">
</form> <!-- boton de enviar y borrar -->

</body>
</html>
